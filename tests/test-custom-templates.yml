name: Test custom templates
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          body_template: "Backport of #<%= number %> to <%= base %>"
          head_template: "bp/<%= base %>/<%= number %>"
          label_pattern: "^bp:(?<base>[^ ]+)$"
          labels_template: '["backport", "<%= base %>"]'
          title_template: "[<%= base %>] <%= title %>"
      - name: Assert action handled custom templates and failed gracefully
        env:
          RESULT: ${{ steps.action.outputs.created_pull_requests }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | grep -qE '^\{.*\}$'; then
              echo "FAIL: action succeeded but output is not a JSON object"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: output should be empty when the action fails"
              exit 1
            fi
            echo "PASS: action failed gracefully (no pull_request payload under workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
